[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemos-platform"
version = "0.7.0"
description = "Knowledge Production Platform — server"
requires-python = ">=3.12"
dependencies = [
    # 0.121 adds function-scoped yield dependencies. Graph reads use that
    # boundary to revalidate the publication generation before a response is
    # sent under PostgreSQL READ COMMITTED.
    "fastapi>=0.121",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "arq>=0.26",
    "bcrypt>=4.0",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-gitlab>=4.4",
    "anthropic>=0.34",
    "mcp>=1.0",
    "prometheus-client>=0.20",
    "pyjwt[crypto]>=2.9",
    "sqlglot>=25",
    # PR-125 — Claude Agent SDK lets the L1~L3 extractor use the
    # operator's Claude Code subscription when ANTHROPIC_API_KEY isn't
    # configured. Falls back to stub when neither is present.
    "claude-agent-sdk>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    # PR-118 in-memory SQLite for the polyglot-typed test session.
    "aiosqlite>=0.20",
    # PR-135 docker-free local mode + tests stub Redis in-process.
    "fakeredis>=2.20",
    # PR-129 UI/UX audit parses rendered templates as DOM.
    "beautifulsoup4>=4.12",
]
# PR-135 — Docker-free local mode. Single-process install for
# laptops / air-gapped trials:
#   pip install 'mnemos-platform[local]'
#   python -m app.serve_local --seed-demo
local = [
    "aiosqlite>=0.20",
    "fakeredis>=2.20",
]
# Vector / semantic search — spec §11.3 "벡터 + BM25 앙상블 (RRF)".
# Optional so a base install stays slim. Activate with
# ``pip install mnemos-platform[search]``, run alembic 0022 to add
# the embedding column, then set MNEMOS_EMBEDDING_PROVIDER + the
# provider's key (VOYAGE_API_KEY / OPENAI_API_KEY).
search = [
    "pgvector>=0.3",
]
# PR-195 — tree-sitter multi-language analyzer (Go/Rust/Ruby and 100+ more
# via one config-driven analyzer; the absorption-review T2 breadth path).
# Optional so the base install and the pure-stdlib analyzers stay
# dependency-free. ``pip install 'mnemos-platform[analyzers-treesitter]'``.
# Absent → go/rust/ruby fall back to Claude-Code agent extraction.
analyzers-treesitter = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=1.0",
]
# Voice INPUT — speech-to-text on the Ask tab (PR-155/156). Default engine
# is Moonshine "Flavors of Moonshine" (``moonshine-voice``, MIT): the Korean
# ``tiny-ko`` flavor is ~26M params, ONNX (no torch), and beats Whisper-tiny
# on Korean — the lightest strong-Korean option. ``av`` (PyAV) decodes the
# browser's webm/opus clip to the 16 kHz PCM Moonshine wants. Optional so a
# base install stays slim/air-gappable; absent → the mic hides and
# ``POST /voice/transcribe`` returns ``503``. ``pip install
# 'mnemos-platform[voice]'``.
voice = [
    "moonshine-voice>=0.0.62",
    "av>=11",
]
# Alternative STT — faster-whisper (CTranslate2 Whisper): multilingual,
# auto-detecting, handles mixed Korean+English in one model. Heavier than
# Moonshine. Select with ``MNEMOS_STT_ENGINE=faster-whisper``.
# ``pip install 'mnemos-platform[voice-whisper]'``.
voice-whisper = [
    "faster-whisper>=1.0",
]
# Voice OUTPUT — text-to-speech (read answers aloud, PR-156) via Kokoro-82M
# (``kokoro``, Apache-2.0): ~82M params, multilingual incl. Korean. Note it
# pulls PyTorch; an operator avoiding torch can wire the ONNX build
# (kokoro-onnx) via MNEMOS_TTS_ENGINE. Needs ``espeak-ng`` (system pkg) for
# English G2P and ``misaki[ko]`` for Korean. Absent → the listen button
# hides and ``POST /voice/speak`` returns ``503``. ``pip install
# 'mnemos-platform[tts]'``.
tts = [
    "kokoro>=0.9.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"

# pgvector is the optional ``search`` extra (spec §11.3). A base install
# omits it, so mypy can't resolve the stubs — that's expected, not a type
# error. The runtime imports are already guarded by the optional-feature
# code paths.
[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

# Optional voice extras (PR-155/156) ship no type stubs / py.typed marker.
# A base install omits them; their imports are guarded by the availability
# probes, so a missing stub is expected, not a type error.
[[tool.mypy.overrides]]
module = ["faster_whisper.*", "moonshine_voice.*", "av.*", "kokoro.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: hits Postgres/Redis and the FastAPI app end-to-end",
]
