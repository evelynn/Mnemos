[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemos-platform"
version = "0.1.0"
description = "Knowledge Production Platform — server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "arq>=0.26",
    "passlib[bcrypt]>=1.7",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-gitlab>=4.4",
    "anthropic>=0.34",
    "mcp>=1.0",
    "prometheus-client>=0.20",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: hits Postgres/Redis and the FastAPI app end-to-end",
]
