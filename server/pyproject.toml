[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemos-platform"
version = "0.1.0"
description = "Knowledge Production Platform — server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "arq>=0.26",
    "bcrypt>=4.0",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-gitlab>=4.4",
    "anthropic>=0.34",
    "mcp>=1.0",
    "prometheus-client>=0.20",
    "pyjwt[crypto]>=2.9",
    "sqlglot>=25",
    # PR-125 — Claude Agent SDK lets the L1~L3 extractor use the
    # operator's Claude Code subscription when ANTHROPIC_API_KEY isn't
    # configured. Falls back to stub when neither is present.
    "claude-agent-sdk>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    # PR-118 in-memory SQLite for the polyglot-typed test session.
    "aiosqlite>=0.20",
    # PR-135 docker-free local mode + tests stub Redis in-process.
    "fakeredis>=2.20",
    # PR-129 UI/UX audit parses rendered templates as DOM.
    "beautifulsoup4>=4.12",
]
# PR-135 — Docker-free local mode. Single-process install for
# laptops / air-gapped trials:
#   pip install 'mnemos-platform[local]'
#   python -m app.serve_local --seed-demo
local = [
    "aiosqlite>=0.20",
    "fakeredis>=2.20",
]
# Vector / semantic search — spec §11.3 "벡터 + BM25 앙상블 (RRF)".
# Optional so a base install stays slim. Activate with
# ``pip install mnemos-platform[search]``, run alembic 0022 to add
# the embedding column, then set MNEMOS_EMBEDDING_PROVIDER + the
# provider's key (VOYAGE_API_KEY / OPENAI_API_KEY).
search = [
    "pgvector>=0.3",
]
# Voice commands on the Ask tab (PR-155). Local speech-to-text via
# faster-whisper (CTranslate2 Whisper) — multilingual incl. Korean,
# CPU-friendly INT8, fully offline once the model is cached. Optional so
# a base install stays slim and air-gappable. Activate with
# ``pip install 'mnemos-platform[voice]'``; the first transcription
# downloads the model (default ``base`` ≈ 145 MB) — pre-bake it into the
# image for an air-gapped host. Absent → the Ask tab hides the mic and
# ``POST /api/v1/voice/transcribe`` returns ``503 stt_unavailable``.
voice = [
    "faster-whisper>=1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"

# pgvector is the optional ``search`` extra (spec §11.3). A base install
# omits it, so mypy can't resolve the stubs — that's expected, not a type
# error. The runtime imports are already guarded by the optional-feature
# code paths.
[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

# faster-whisper is the optional ``voice`` extra (PR-155) and ships no
# type stubs / py.typed marker. A base install omits it entirely; when it
# is present its import is already guarded by the optional-feature probe.
[[tool.mypy.overrides]]
module = ["faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: hits Postgres/Redis and the FastAPI app end-to-end",
]
