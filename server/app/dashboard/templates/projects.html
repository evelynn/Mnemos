{% extends "_layout.html" %}
{% block title %}Projects — Mnemos{% endblock %}
{% block content %}
<header class="page-head"><h1 data-i18n="Projects">Projects</h1></header>

<section>
  <h2 data-i18n="Register project">Register project</h2>
  <form onsubmit="return createProject(event)">
    <label><span data-i18n="Name">Name</span><input type="text" name="name" required data-i18n-placeholder="e.g. payments-core" placeholder="e.g. payments-core" /></label>
    <label><span data-i18n="GitLab project ID">GitLab project ID</span><input type="number" name="gitlab_project_id" required min="1" /></label>
    <label><span data-i18n="GitLab URL">GitLab URL</span><input type="url" name="gitlab_url" required data-i18n-placeholder="https://gitlab.example.com/group/repo" placeholder="https://gitlab.example.com/group/repo" /></label>
    <label><span data-i18n="Default branch">Default branch</span><input type="text" name="default_branch" value="main" /></label>
    <label><span data-i18n="Languages">Languages</span>
      <select name="languages" multiple required size="2">
        <option value="csharp">csharp</option>
        <option value="typescript">typescript</option>
      </select>
    </label>
    <button type="submit" class="primary" data-i18n="Create project">Create</button>
  </form>
  <pre id="create-result" class="muted"></pre>
  <div id="post-create-cta" class="onboarding-step-cta" hidden>
    <strong data-i18n="Next:">Next:</strong>
    <a class="primary" href="/analysis?onboard=1" data-i18n="Start the first analysis run →">Start the first analysis run →</a>
  </div>
</section>

<section>
  <h2 data-i18n="Projects in your organisation">Projects in your organisation</h2>
  <button class="primary" onclick="loadProjects()" data-i18n="Refresh">Refresh</button>
  <div id="projects-list"><p class="muted" data-i18n="Click refresh.">Click refresh.</p></div>
</section>

<script>
async function createProject(ev) {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const langs = fd.getAll("languages");
  const r = await fetch("/api/v1/projects", {
    method: "POST",
    headers: {"content-type": "application/json"},
    body: JSON.stringify({
      name: fd.get("name"),
      gitlab_project_id: parseInt(fd.get("gitlab_project_id"), 10),
      gitlab_url: fd.get("gitlab_url"),
      default_branch: fd.get("default_branch") || "main",
      languages: langs,
    }),
  });
  const text = await r.text();
  // PR-137 — raw HTTP body looked like server errors. Failures now
  // route through MnemosUI.showError (toast + structured detail).
  if (!r.ok) {
    document.getElementById("create-result").textContent = "";
    await MnemosUI.showError(
      MnemosUI.t("Project creation failed"),
      r,
    );
    return false;
  }
  document.getElementById("create-result").textContent = "";
  {
    ev.target.reset();
    // P2-9 onboarding auto-progression: mark step 1 done, surface a
    // "Analyse this project" CTA next to the create result so the
    // operator doesn't have to scroll back up and find their new
    // project in the list.
    try {
      const payload = JSON.parse(text);
      localStorage.setItem("mnemos_onboarding_step1_done", payload.id || "1");
      MnemosUI.showToast(
        MnemosUI.t(
          'Project "$1" created. Ready to analyse it?',
          { name: payload.name || "registered" },
        ),
        "success",
      );
      const cta = document.getElementById("post-create-cta");
      if (cta) {
        cta.hidden = false;
        cta.querySelector("a").href = `/analysis?project=${payload.id}&onboard=1`;
      }
    } catch (_) {
      // Non-JSON body — fall back to just refreshing the list.
    }
    loadProjects();
  }
  return false;
}

async function loadProjects() {
  const r = await fetch("/api/v1/projects");
  const out = document.getElementById("projects-list");
  if (!r.ok) {
    out.innerHTML = '<p class="muted"></p>';
    await MnemosUI.showError(
      MnemosUI.t("Could not load projects"),
      r,
    );
    return;
  }
  const rows = await r.json();
  if (!rows.length) {
    // PR-137 — empty state with a CTA so a fresh-org operator
    // doesn't land in a dead end.
    out.innerHTML =
      '<p class="muted">' + MnemosUI.escapeHtml(MnemosUI.t(
        "No projects in your organisation yet."
      )) + '</p>' +
      '<p><a class="primary" href="#register-project" '
      + 'onclick="document.querySelector(&quot;form&quot;).scrollIntoView({behavior:&quot;smooth&quot;});return false;">'
      + MnemosUI.escapeHtml(MnemosUI.t(
          "Register your first project →"
        )) + '</a></p>';
    return;
  }
  let html = '<table class="data"><thead><tr>'
    + `<th data-i18n="Name">${MnemosUI.t("Name")}</th>`
    + `<th data-i18n="Languages">${MnemosUI.t("Languages")}</th>`
    + `<th data-i18n="Branch">${MnemosUI.t("Branch")}</th>`
    + `<th data-i18n="ID">${MnemosUI.t("ID")}</th>`
    + '<th></th></tr></thead><tbody>';
  const _esc = MnemosUI.escapeHtml;
  for (const p of rows) {
    html += `<tr>
      <td>${_esc(p.name)}</td>
      <td>${_esc((p.languages || []).join(", "))}</td>
      <td><code>${_esc(p.default_branch)}</code></td>
      <td><code class="muted">${_esc(p.id)}</code></td>
      <td><a href="/analysis?project=${encodeURIComponent(p.id)}" data-i18n="Analyse">${MnemosUI.t("Analyse")}</a></td>
    </tr>`;
  }
  html += "</tbody></table>";
  out.innerHTML = html;
  MnemosUI.applyI18n(out);
}

loadProjects();
</script>
{% endblock %}
