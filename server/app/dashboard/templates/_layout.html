{% extends "base.html" %}
{% block body %}
<script>
  // UX-only hint — the server enforces authorisation on every
  // admin-only endpoint with `require_admin`. Client-side this just
  // hides buttons that would 403 anyway, so a viewer doesn't see a
  // button labelled "(admin)" and click it just to be told no.
  // Team B 5th-round must-fix #7 (variable rename) + comment.
  window.MNEMOS_USER_ROLE_HINT = "{{ user.role }}";
</script>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">Mnemos</div>
    <nav>
      <a href="/" class="{% if active_tab == 'dashboard' %}active{% endif %}">Dashboard</a>
      <a href="/projects" class="{% if active_tab == 'projects' %}active{% endif %}">Projects</a>
      <a href="/analysis" class="{% if active_tab == 'analysis' %}active{% endif %}">Analysis</a>
      <a href="/data" class="{% if active_tab == 'data' %}active{% endif %}">Data</a>
      <a href="/plans" class="{% if active_tab == 'plans' %}active{% endif %}">Plans</a>
      <a href="/diffs" class="{% if active_tab == 'diffs' %}active{% endif %}">Diffs</a>
      <a href="/findings" class="{% if active_tab == 'findings' %}active{% endif %}">Findings</a>
      <a href="/audit" class="{% if active_tab == 'audit' %}active{% endif %}">Audit</a>
      <a href="/settings" class="{% if active_tab == 'settings' %}active{% endif %}">Settings</a>
      {% if user.role == 'admin' %}
      <div class="nav-section muted">Admin</div>
      <a href="/organizations" class="{% if active_tab == 'organizations' %}active{% endif %}">Organizations</a>
      <a href="/sso" class="{% if active_tab == 'sso' %}active{% endif %}">SSO / OIDC</a>
      <a href="/gdpr" class="{% if active_tab == 'gdpr' %}active{% endif %}">GDPR tools</a>
      {% endif %}
    </nav>
    <form method="post" action="/logout" class="logout-form">
      <span class="muted">{{ user.username }}</span>
      <button type="submit">Sign out</button>
    </form>
  </aside>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>
{% endblock %}
