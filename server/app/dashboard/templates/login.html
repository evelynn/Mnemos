{% extends "base.html" %}
{% block title %}Sign in — Mnemos{% endblock %}
{% block body %}
<main class="login">
  <h1>Mnemos</h1>
  <p class="subtitle">Knowledge Production Platform</p>
  <form method="post" action="/login" class="login-form">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <label>
      Username
      <input type="text" name="username" autocomplete="username" required autofocus />
    </label>
    <label>
      Password
      <input type="password" name="password" autocomplete="current-password" required />
    </label>
    <button type="submit">Sign in</button>
  </form>
  <p class="subtitle">
    <a href="/api/v1/auth/oidc/login">Sign in with SSO</a>
    <span class="muted"> (only if an OIDC provider is configured)</span>
  </p>
</main>
<script>
  // Preserve the URL fragment a share-URL operator landed on before the
  // login redirect kicked in. We stash it in sessionStorage so the
  // post-login redirect to /diffs can replay it via the existing
  // ``maybeAutoLoadFromHash`` flow. Fragment-only — no token leakage.
  (function () {
    var h = window.location.hash || "";
    if (h && h.length > 1) {
      try { sessionStorage.setItem("mnemos_post_login_hash", h); } catch (_) {}
    }
  })();
</script>
{% endblock %}
