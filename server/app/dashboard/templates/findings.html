{% extends "_layout.html" %}
{% block title %}Findings — Mnemos{% endblock %}
{% block content %}
<header class="page-head"><h1 data-i18n="Findings">Findings</h1></header>

<form onsubmit="return loadFindings(event)">
  <label><span data-i18n="Project ID">Project ID</span><input type="text" id="pid" required placeholder="uuid" /></label>
  <label><span data-i18n="Severity">Severity</span>
    <select id="sev"><option value="">(all)</option><option>info</option><option>warning</option><option>error</option></select>
  </label>
  <label><span data-i18n="Status">Status</span>
    <select id="st"><option value="">(all)</option><option>open</option><option>acknowledged</option><option>resolved</option><option>false_positive</option></select>
  </label>
  <button class="primary" type="submit" data-i18n="Load">Load</button>
  <button type="button" onclick="rebuild()" data-i18n="Rebuild">Rebuild</button>
  <button type="button" onclick="exportFindings()" data-i18n="Export CSV">Export CSV</button>
</form>
<div id="out"></div>

<script>
async function loadFindings(ev) {
  ev.preventDefault();
  const pid = document.getElementById("pid").value.trim();
  const sev = document.getElementById("sev").value;
  const st = document.getElementById("st").value;
  if (!pid) return false;
  const qs = new URLSearchParams();
  if (sev) qs.set("severity", sev);
  if (st) qs.set("status", st);
  const r = await fetch(`/api/v1/projects/${pid}/findings?${qs}`);
  const rows = await r.json();
  // P2-9 onboarding step 3 — 8th-round audit B3: reaching the
  // findings view *at all* (with the form filled out) counts as
  // "reviewed". The prior ``rows.length > 0`` gate left the operator
  // stuck on step 3 forever when an analysis genuinely produced zero
  // findings — UX expectation said "I clicked Review, so I'm done",
  // platform said "nothing rendered, so you aren't".
  try {
    localStorage.setItem("mnemos_onboarding_step3_done", "1");
  } catch (_) {}
  const out = document.getElementById("out");
  if (!Array.isArray(rows) || rows.length === 0) {
    out.innerHTML = '<p class="muted" data-i18n="No findings.">No findings.</p>';
    MnemosUI.applyI18n(out);
    return false;
  }
  // P2-6 — chunked rendering so a project with thousands of open
  // findings doesn't freeze the browser on the first innerHTML write.
  _renderFindingsPaginated(out, rows);
  return false;
}

const _FINDINGS_PAGE_SIZE = 100;

function _renderFindingsPaginated(out, rows) {
  const total = rows.length;
  out.innerHTML = '<table class="data"><thead><tr>'
    + '<th data-i18n="Priority">Priority</th>'
    + '<th data-i18n="Risk">Risk</th>'
    + '<th data-i18n="Kind">Kind</th>'
    + '<th data-i18n="Severity">Severity</th>'
    + '<th data-i18n="Status">Status</th>'
    + '<th data-i18n="Subject">Subject</th>'
    + '<th data-i18n="Suggested fix">Suggested fix</th>'
    + '</tr></thead>'
    + '<tbody id="findings-tbody"></tbody></table>'
    + '<p class="muted" id="findings-status"></p> '
    + `<button type="button" class="primary" id="findings-more" hidden>`
    + `Show next ${_FINDINGS_PAGE_SIZE}</button>`;
  const tbody = document.getElementById("findings-tbody");
  tbody.dataset.offset = "0";
  tbody._rows = rows;
  _showNextFindingsPage();
}

function _showNextFindingsPage() {
  const tbody = document.getElementById("findings-tbody");
  if (!tbody) return;
  const rows = tbody._rows || [];
  let offset = parseInt(tbody.dataset.offset || "0", 10);
  const total = rows.length;
  const next = Math.min(offset + _FINDINGS_PAGE_SIZE, total);
  const tpl = document.createElement("template");
  let html = "";
  for (let i = offset; i < next; i++) {
    const f = rows[i];
    const sev = escapeHtml(f.severity || "info");
    const status = escapeHtml(f.status || "open");
    const priority = escapeHtml(f.priority || "P4");
    const risk = Number.isFinite(f.risk_score) ? f.risk_score : 0;
    const cwe = f.cwe_id
      ? ` <a class="cwe-link" href="https://cwe.mitre.org/data/definitions/${escapeHtml(String(f.cwe_id).replace(/[^0-9]/g, ""))}.html" target="_blank" rel="noopener">${escapeHtml(f.cwe_id)}</a>`
      : "";
    const remediation = f.remediation
      ? `<details class="fix-detail"><summary>${escapeHtml(f.priority || "")} fix</summary>`
        + `<p>${escapeHtml(f.remediation)}</p>${cwe}`
        + `<details class="raw-detail"><summary>raw</summary><pre>${escapeHtml(JSON.stringify(f.detail))}</pre></details>`
        + `</details>`
      : `<pre>${escapeHtml(JSON.stringify(f.detail))}</pre>`;
    html += `<tr>`
      + `<td><span class="priority-pill ${priority}">${priority}</span></td>`
      + `<td><span class="risk-bar" style="--risk:${risk}">${risk}</span></td>`
      + `<td>${escapeHtml(f.kind || "")}</td>`
      + `<td><span class="badge ${sev}">${sev}</span></td>`
      + `<td><span class="badge ${status}">${status}</span></td>`
      + `<td><code>${escapeHtml(f.subject_node_id ?? f.subject_edge_id ?? "")}</code></td>`
      + `<td>${remediation}</td>`
      + `</tr>`;
  }
  tpl.innerHTML = html;
  tbody.appendChild(tpl.content);
  MnemosUI.applyI18n(tbody);
  tbody.dataset.offset = String(next);
  const status = document.getElementById("findings-status");
  if (status) status.textContent = `Showing ${next} of ${total} findings.`;
  const more = document.getElementById("findings-more");
  if (more) {
    more.hidden = next >= total;
    more.onclick = _showNextFindingsPage;
  }
}

async function exportFindings() {
  const pid = document.getElementById("pid").value.trim();
  if (!pid) {
    MnemosUI.showToast(MnemosUI.t("Enter a project ID first."), "warn");
    return;
  }
  const sev = document.getElementById("sev").value;
  const st = document.getElementById("st").value;
  const qs = new URLSearchParams();
  if (sev) qs.set("severity", sev);
  if (st) qs.set("status", st);
  const r = await fetch(`/api/v1/projects/${pid}/findings?${qs}`);
  if (!r.ok) { await MnemosUI.showError("Export failed", r); return; }
  const rows = await r.json();
  if (!rows.length) {
    MnemosUI.showToast(MnemosUI.t("Nothing to export."), "warn");
    return;
  }
  // Flatten the JSONB detail blob to its top-level keys for the
  // CSV — full nested JSON survives in the ``detail_json`` column.
  const flat = rows.map((f) => ({
    id: f.id,
    kind: f.kind,
    severity: f.severity,
    status: f.status,
    subject: f.subject_node_id || f.subject_edge_id || "",
    detail_json: JSON.stringify(f.detail),
  }));
  MnemosUI.exportCsv(flat, ["id", "kind", "severity", "status", "subject", "detail_json"],
    `findings-${pid.slice(0, 8)}-${Date.now()}.csv`);
  MnemosUI.showToast(MnemosUI.t("Exported."), "success");
}

async function rebuild() {
  const pid = document.getElementById("pid").value.trim();
  if (!pid) return;
  const r = await fetch(`/api/v1/projects/${pid}/findings/rebuild`, {method: "POST"});
  if (!r.ok) { await MnemosUI.showError("Rebuild failed", r); return; }
  MnemosUI.showToast(MnemosUI.t("Findings rebuild queued."), "success");
}

// P2-7 dashboard drill-down — accept ``?status=open&severity=…`` so
// the stat-card link arrives with the filter already applied.
(function fromQuery() {
  const params = new URLSearchParams(window.location.search);
  const status = params.get("status");
  const severity = params.get("severity");
  if (status) document.getElementById("st").value = status;
  if (severity) document.getElementById("sev").value = severity;
})();
</script>
{% endblock %}
