# Optional monitoring stack. Enable with:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Scrapes the platform's /metrics endpoint, ships to Prometheus,
# surfaces through Grafana. Neither container persists outside their
# named volumes — wipe them if you change the dashboard JSON.
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mnemos-prometheus
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "${PROMETHEUS_PORT:-16403}:9090"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: mnemos-grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-16402}:3000"
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
