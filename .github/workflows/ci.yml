name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.5.7
      - name: Ruff
        run: ruff check server/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mnemos
          POSTGRES_PASSWORD: mnemos
          POSTGRES_DB: mnemos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mnemos -d mnemos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://mnemos:mnemos@localhost:5432/mnemos
      REDIS_URL: redis://localhost:6379/0
      FERNET_KEY: 4oEY9MJGAjGCbrScyvvi4CZgm8KxFuQuklXSQwUYpys=
      SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: server
        run: |
          pip install --upgrade pip
          pip install -e '.[dev]'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build .NET analyzers
        # The MSSQL analyzer + the C# project-graph analyzer ship as
        # compiled binaries. CI builds them on every test run so a
        # regression in the analyzer source surfaces at PR time rather
        # than in production when the ``db_probe`` subprocess fails
        # silently. Team B 5th-round must-fix #9.
        run: |
          dotnet build analyzers/ggoss-sql-mssql -c Release
          dotnet build analyzers/ggoss-csharp -c Release
      - name: Alembic upgrade/downgrade cycle
        working-directory: server
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Pytest
        working-directory: server
        run: pytest -v
      - name: Verify integration tests actually ran
        # Belt-and-braces guard: the 16 ``@pytest.mark.integration``
        # cases must show up in the collection plan. Anything less
        # means an env var change silently deselected them.
        working-directory: server
        run: |
          count=$(pytest --co -q -m integration 2>/dev/null | grep -cE '::test_')
          echo "integration tests collected: $count"
          test "$count" -ge 9
      - name: Verify PR-138 real-execution E2E tests collected
        # The PR-138 series adds substantive real-execution tests
        # (HTTP via ASGITransport, polyglot SQLite, real seed graph).
        # A future refactor that deletes the files or breaks the
        # module-scoped fixtures must fail CI loudly, not silently
        # regress the suite. ≥30 PR-138* tests should always be
        # collected.
        working-directory: server
        run: |
          count=$(pytest --co -q tests/test_pr138*.py 2>/dev/null | grep -cE '::test_')
          echo "PR-138 real-execution tests collected: $count"
          test "$count" -ge 30

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build platform image
        run: docker build -t mnemos-platform:ci server/
      - name: Upload platform image as artefact
        uses: actions/upload-artifact@v4
        with:
          name: platform-image
          path: /tmp/platform.tar
          if-no-files-found: ignore
      # Export so downstream jobs can reuse without rebuilding.
      - name: Save image tarball
        run: docker save mnemos-platform:ci -o /tmp/platform.tar

  sbom-and-scan:
    runs-on: ubuntu-latest
    needs: [docker-build]
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: platform-image
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/platform.tar
      - name: Trivy SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: image
          image-ref: mnemos-platform:ci
          format: cyclonedx
          output: sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
      - name: Trivy vulnerability scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: image
          image-ref: mnemos-platform:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy.sarif
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
