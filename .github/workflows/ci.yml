name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.5.7
      - name: Ruff
        run: ruff check server/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mnemos
          POSTGRES_PASSWORD: mnemos
          POSTGRES_DB: mnemos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mnemos -d mnemos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://mnemos:mnemos@localhost:5432/mnemos
      REDIS_URL: redis://localhost:6379/0
      FERNET_KEY: 4oEY9MJGAjGCbrScyvvi4CZgm8KxFuQuklXSQwUYpys=
      SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: server
        run: |
          pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Alembic upgrade/downgrade cycle
        working-directory: server
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Pytest
        working-directory: server
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build platform image
        run: docker build -t mnemos-platform:ci server/
