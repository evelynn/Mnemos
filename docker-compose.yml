services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mnemos-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mnemos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mnemos}
      POSTGRES_DB: ${POSTGRES_DB:-mnemos}
    ports:
      - "${POSTGRES_PORT:-16404}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mnemos} -d ${POSTGRES_DB:-mnemos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mnemos-redis
    ports:
      - "${REDIS_PORT:-16405}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  platform:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: mnemos-platform
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mnemos}:${POSTGRES_PASSWORD:-mnemos}@postgres:5432/${POSTGRES_DB:-mnemos}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      FERNET_KEY: ${FERNET_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SOURCE_MIRROR_ROOT: /var/lib/mnemos/repos
      SOURCE_WORKTREE_ROOT: /var/lib/mnemos/worktrees
      SOURCE_ALLOWED_ROOT: /work
      SOURCE_PROJECT_ROOTS: ${SOURCE_PROJECT_ROOTS:-}
      MNEMOS_OTLP_ORG_TOKENS: ${MNEMOS_OTLP_ORG_TOKENS:-}
      MNEMOS_OTLP_TOKEN: ${MNEMOS_OTLP_TOKEN:-}
      MNEMOS_OTLP_ORGANIZATION_ID: ${MNEMOS_OTLP_ORGANIZATION_ID:-}
      MNEMOS_INREPO_ANALYZERS: "1"
      MNEMOS_STALE_RUN_AFTER_SEC: ${MNEMOS_STALE_RUN_AFTER_SEC:-86400}
      MNEMOS_SEEN_MEMORY_LIMIT: ${MNEMOS_SEEN_MEMORY_LIMIT:-100000}
    ports:
      - "${PLATFORM_PORT:-16401}:8080"
    volumes:
      - platform_data:/var/lib/mnemos
      - repos_data:/var/lib/mnemos/repos
      - ${MNEMOS_SOURCE_ROOT:-.}:/work:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: mnemos-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mnemos}:${POSTGRES_PASSWORD:-mnemos}@postgres:5432/${POSTGRES_DB:-mnemos}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      FERNET_KEY: ${FERNET_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SOURCE_MIRROR_ROOT: /var/lib/mnemos/repos
      SOURCE_WORKTREE_ROOT: /var/lib/mnemos/worktrees
      SOURCE_ALLOWED_ROOT: /work
      SOURCE_PROJECT_ROOTS: ${SOURCE_PROJECT_ROOTS:-}
      MNEMOS_INREPO_ANALYZERS: "1"
      MNEMOS_STALE_RUN_AFTER_SEC: ${MNEMOS_STALE_RUN_AFTER_SEC:-86400}
      MNEMOS_SEEN_MEMORY_LIMIT: ${MNEMOS_SEEN_MEMORY_LIMIT:-100000}
    command: ["python", "-m", "app.worker"]
    volumes:
      - platform_data:/var/lib/mnemos
      - repos_data:/var/lib/mnemos/repos
      - ${MNEMOS_SOURCE_ROOT:-.}:/work:ro

  # Standalone analyzer images remain optional contract-test artifacts.  The
  # normal platform/worker image above already contains the runnable in-repo
  # analyzers; these profile services are not an execution path for the worker.
  analyzer-csharp:
    profiles: ["analyzers"]
    build:
      context: ./analyzers/ggoss-csharp
      dockerfile: Dockerfile
    image: mnemos/ggoss-csharp:latest
    entrypoint: ["true"]

  analyzer-ts:
    profiles: ["analyzers"]
    build:
      context: ./analyzers/ggoss-ts
      dockerfile: Dockerfile
    image: mnemos/ggoss-ts:latest
    entrypoint: ["true"]

  # PR-115 — Python analyzer. Pure stdlib (ast module), zero
  # third-party deps so the build is the fastest of the six.
  analyzer-py:
    profiles: ["analyzers"]
    build:
      context: ./analyzers/ggoss-py
      dockerfile: Dockerfile
    image: mnemos/ggoss-py:latest
    entrypoint: ["true"]

  # PR-191 — C/C++ analyzer. Pure stdlib (regex + brace scanner),
  # zero third-party deps — same minimal shape as ggoss-py.
  analyzer-cpp:
    profiles: ["analyzers"]
    build:
      context: ./analyzers/ggoss-cpp
      dockerfile: Dockerfile
    image: mnemos/ggoss-cpp:latest
    entrypoint: ["true"]

  # PR-192 — Java analyzer. Pure stdlib (regex + brace scanner),
  # zero third-party deps — same minimal shape as ggoss-py.
  analyzer-java:
    profiles: ["analyzers"]
    build:
      context: ./analyzers/ggoss-java
      dockerfile: Dockerfile
    image: mnemos/ggoss-java:latest
    entrypoint: ["true"]

  # PR-193 — Web (HTML/CSS) analyzer. Pure stdlib (regex), zero deps.
  analyzer-web:
    profiles: ["analyzers"]
    build:
      context: ./analyzers/ggoss-web
      dockerfile: Dockerfile
    image: mnemos/ggoss-web:latest
    entrypoint: ["true"]

  # PR-194 — Kotlin analyzer. Pure stdlib (regex + brace scanner), zero deps.
  analyzer-kotlin:
    profiles: ["analyzers"]
    build:
      context: ./analyzers/ggoss-kotlin
      dockerfile: Dockerfile
    image: mnemos/ggoss-kotlin:latest
    entrypoint: ["true"]

  # PR-195 — tree-sitter multi-language analyzer (Go/Rust/Ruby PoC).
  # Has a dependency (tree-sitter-language-pack) — the opt-in breadth path.
  analyzer-treesitter:
    profiles: ["analyzers"]
    build:
      context: ./analyzers/ggoss-treesitter
      dockerfile: Dockerfile
    image: mnemos/ggoss-treesitter:latest
    entrypoint: ["true"]

  analyzer-sql-mssql:
    profiles: ["analyzers"]
    build:
      context: ./analyzers/ggoss-sql-mssql
      dockerfile: Dockerfile
    image: mnemos/ggoss-sql-mssql:latest
    entrypoint: ["true"]

  analyzer-sql-oracle:
    profiles: ["analyzers"]
    build:
      context: ./analyzers/ggoss-sql-oracle
      dockerfile: Dockerfile
    image: mnemos/ggoss-sql-oracle:latest
    entrypoint: ["true"]

  analyzer-binary-dotnet:
    profiles: ["analyzers"]
    build:
      context: ./analyzers/ggoss-binary-dotnet
      dockerfile: Dockerfile
    image: mnemos/ggoss-binary-dotnet:latest
    entrypoint: ["true"]

volumes:
  postgres_data:
  redis_data:
  platform_data:
  repos_data:
